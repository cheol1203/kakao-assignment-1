<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanilla JS Todo App</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="todo-container">
    <section class="todo-card">
      <div class="todo-header">
        <p class="todo-label">Vanilla JS Todo</p>
        <h1>오늘 할 일</h1>
        <p class="todo-description">
          날짜별로 해야 할 일을 관리해보세요.
        </p>
      </div>

      <!-- 일간 뷰 날짜 이동 영역 -->
      <div class="date-view-area">
        <button id="previousDateButton" class="date-button">이전</button>
        <p id="selectedDateText" class="selected-date-text"></p>
        <button id="nextDateButton" class="date-button">다음</button>
      </div>

      <div class="todo-input-area">
        <input
          type="text"
          id="todoInput"
          class="todo-input"
          placeholder="할 일을 입력하세요"
        />
        <button id="addTodoButton" class="add-button">추가</button>
      </div>

      <!-- 안내 메시지 영역 -->
      <p id="messageText" class="message-text"></p>

      <!-- 상태별 필터 탭 -->
      <div class="filter-tab-area">
        <button class="filter-tab active" data-filter="all">전체</button>
        <button class="filter-tab" data-filter="active">진행 중</button>
        <button class="filter-tab" data-filter="completed">완료</button>
      </div>

      <!-- Todo 목록 영역 -->
      <ul id="todoList" class="todo-list"></ul>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
